<script type="text/plain" id="md"># Command Center rebuild: briefing for a design conversation

Prepared Nov 15 2026 by Claude Code for Sean, to take into a regular Claude chat. Go through the sections below one at a time, have a back-and-forth about each, and at the end ask Claude to write the "Instructions for Claude Code" block described at the bottom. Paste that block back into the Claude Code session.

## Links

- New Command Center (private, built, not switched on): https://claude.ai/artifact/V2AFn5upZT2sCNvfkZbjxu
- Old Command Center (still running until switch-on): https://claude.ai/artifact/XfLznGMXYLP4jjL4FoknxM
- Code, scan prompts and checklists: GitHub repository photoartstar/command-center, branch claude/command-center-rebuild-3kec28 (not pushed yet; waiting on Sean's OK)
- Notes for Claude in Drive: Claude > Claude HQ > memory > context > command-center-rebuild.md and command-center-handoff-briefing.md
- Shared QAM data: Airtable base "QAM Team Tracker (trial)"

## Where things stand

- The page is built. It has a top bar with Undo and Refresh, the On Deck front page with a card for each of the five areas, a full QAM page and a full My Practice page. Teaching and NYU, Money and Personal are simple lists until they are designed.
- Every item can be checked off, snoozed (tomorrow, 3 days, next week) or marked "doesn't belong". Done and dismissed items never come back.
- Nothing is scanning yet. Scans switch on only after the Mac is back and every feeding task is checked. Until then the page shows the seeded timeline, goals and two starter items.
- Airtable got new Contacts fields for the people wiki (introduced by, summary, last conversation, next step date, keywords, email, Granola and email links), a Received date on Funding for renewal reminders, and a new Social Posts table with the approval flow. Two social ideas are in it: Trans Day of Remembrance (Nov 20) and the vertical website video cut.

## Already decided today (no need to revisit)

- The front page is called On Deck. The Morning brief is paused; On Deck replaces it.
- The QAM weekly advisor stays. Its new prompt (Drive and Airtable instead of Mac files) needs Sean's approval from a conversation linked to the Mac once it is back.
- NYU email is read through the web interface, so a separate NYU mail pass will run on the Mac twice on weekdays.
- Council meeting: Carl Wilson, Nov 24 at 10am, with Sam and Maureen. San Francisco talk: St. Joseph's event, Jan 23. AR launch: finalized by Dec 1, likely sooner.
- The "January 6th event" is a misunderstanding and never appears.

## Questions, section by section

### 1. On Deck (front page)

Current rules: due within a day; requests with a deadline appear the day before; requests with no deadline appear after 4 days without a reply; circle-back notes appear when their time comes; big grants appear 10 days out; bills appear 3 days before the due date.

1. Is "the day before" right for requests with a deadline, or do some kinds need more lead time (for example anything that needs a document from someone else)?
2. What makes a grant or deadline "big"? Proposed: $25,000 and up, or anything Kevin marks priority. Should some types always count as big (fellowships, museum shows)?
3. Should calendar events show On Deck at all, or only when they need preparation?
4. Each area card shows the top 3 items. Right number?
5. Three scans a day (about 6:40am, 12:40pm and 5:40pm Eastern). Right times?
6. When something is snoozed, are tomorrow, 3 days and next week the right choices?

### 2. QAM page

1. Timeline: any milestones missing? Do Amanda Milan (New York), the LLC signature and Ogunquit have dates or target months yet?
2. Leads: should Sam's and Maureen's leads show too, or only Sean's? Should the team (Sam, Maureen, Tasneem, Kevin, Amy) be hidden, as it is now?
3. A lead counts as "quiet" after 21 days without contact, and then the page suggests going back through whoever introduced them. Is 21 days right?
4. Renewals: which gifts should be tracked, and when did each come in? (Couch Family Foundation is the example from the call.)
5. Applications: the tab reads the Airtable Funding table. Kevin's tracker stays read only. Should Claude copy Kevin's opportunities into the Funding table so there is one list, or keep them separate?

### 3. QAM people wiki (Airtable Contacts)

1. How far back should the backfill go for email and Granola: all time, or since a date?
2. Some records hold two people (for example "Andy Cushman and Katrina Stewart"). OK to split them into one person per record?
3. Sam and Maureen will read every note. Anything that should never be written there, beyond family and witness details?
4. The monthly backup goes to QAM > 06 Team & Updates > People Wiki as one page per person. Right place?

### 4. QAM social

1. How many QAM posts a week, and on which days?
2. The strategy link points to the ICA San José rollout doc. Does QAM need a new strategy after ICA closes on Feb 21?
3. Maureen approves by ticking "Maureen OK" in Airtable, or leaves notes. Will she actually work that way, or does she need something simpler (an email-free view, a weekly review)?
4. Tasneem gets her task with an image folder and instruction card the day before the post. Enough lead time?
5. Trans Day of Remembrance is Nov 20. Who should it honor or feature, and are there images Claude should use?

### 5. My Practice

1. Big Goals: which New York galleries, which museums, which fellowships are the real targets? Who in Sean's circle could introduce him to each?
2. A map of his circle: who belongs on it, and what are the groups (artists, curators, collectors, funders, academics)?
3. Night-before briefings: what makes a meeting important enough (a curator, gallerist, funder, visiting artist at the EFA studio)? Anyone always or never?
4. Nudges: unsent drafts, warm intros with no date, bills near late fees, travel changes. Anything else that tends to slip?
5. CV approvals: one tap updates the CV, the CV PDF, the website and the Art Practice Master. Is the website repository for seanfader.com on GitHub, and what is it called?
6. @photoartstar social: same approval flow as QAM, or a lighter version?
7. Guggenheim 2027: does Sean know who his letter writers were, so Claude can check they all arrived?

### 6. Teaching and NYU page (to design)

1. What is in a teaching week: classes, Brightspace homework checks, advising, committees, the tenure dossier, the Memorials class, NYU email?
2. What would Sean want to see at a glance on this page?
3. Which NYU dates matter most (grades due, tenure milestones, committee meetings)?

### 7. Money page (to design)

1. What should show: Zoho uncategorized charges, bills due, NYFA reimbursements to claim, invoices owed to Sean, PSLF and student loans, the Apple Card monthly import?
2. The old Command Center had a Books tab that categorized Zoho charges with one tap. Bring that back here?
3. What does "on track" look like for money each month?

### 8. Personal page (to design)

1. What belongs here: health, family, travel, home, the French visa, friends' birthdays, anything else?
2. What should never appear on a page Claude can see?

### 9. Carrying over from the old Command Center

The old page had things the brief did not mention. For each, keep, move or drop?
1. Funding and Career pipeline with stages (prospect, drafting, submitted, awarded, not a fit, next year) and the "must apply this year" pins.
2. Recommenders and references tracker.
3. Career moves and academic job watch.
4. Student loans and PSLF buyback.
5. My to-do list with hand-added items. (The new page has no way to add an item by hand yet. Should it?)
6. "Waiting on people": sent mail with no reply.

### 10. Look and feel

After opening the new page: does it feel lighter than the old one? Anything still too wordy, too small on the phone, or missing a visual?

## What to bring back to Claude Code

At the end of the chat, ask Claude:

"Write an 'Instructions for Claude Code' block for the Command Center rebuild. Use these headings in this order: On Deck, QAM page, People wiki, QAM social, My Practice, Teaching and NYU, Money, Personal, Carry over from old Command Center, Look and feel, Other. Under each, list decisions as short bullet points with any dates, names, amounts and thresholds. Mark anything still undecided as OPEN. No em dashes."

Then paste that block into the Claude Code session.
